            '<button onclick="submitForgotPassword()" class="login-btn"><i class="fa-solid fa-envelope-circle-check mr-2"></i>Send Password to My Email</button>' +
            '<div class="text-center mt-5"><span class="login-link" onclick="state.authView=\'login\';render()"><i class="fa-solid fa-arrow-left mr-1"></i>Back to Sign In</span></div>' +

    async function submitSignupRequest() {
        var name = (document.getElementById('regFullName') ? document.getElementById('regFullName').value : state.signupName).trim();
        var username = (document.getElementById('regUsername') ? document.getElementById('regUsername').value : state.signupUsername).trim();
        var email = (document.getElementById('regEmail') ? document.getElementById('regEmail').value : state.signupEmail).trim();
        var pass = document.getElementById('regPassword') ? document.getElementById('regPassword').value : '';
        var confirmPass = document.getElementById('regConfirmPassword') ? document.getElementById('regConfirmPassword').value : '';

        if (!name || !username || !email || !pass || !confirmPass) {
            Swal.fire({icon:'warning',title:'Missing Fields',text:'Please fill in all fields.',background:'#1e293b',color:'#fff'});
            return;
        }
        if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
            Swal.fire({icon:'warning',title:'Invalid Email',text:'Please enter a valid email address.',background:'#1e293b',color:'#fff'});
            return;
        }
        if (pass.length < 4) {
            Swal.fire({icon:'warning',title:'Weak Password',text:'Password must be at least 4 characters long.',background:'#1e293b',color:'#fff'});
            return;
        }
        if (pass !== confirmPass) {
            Swal.fire({icon:'error',title:'Password Mismatch',text:'Password and Confirm Password do not match.',background:'#1e293b',color:'#fff'});
            return;
        }

        if (!DB.accountRequests) DB.accountRequests = [];
        var existingUser = DB.users.find(function(u) { return u.username.toLowerCase() === username.toLowerCase(); });
        if (existingUser) {
            Swal.fire({icon:'error',title:'Username Already Exists',text:'User ID "' + username + '" is already registered. Please choose another User ID.',background:'#1e293b',color:'#fff'});
            return;
        }
        var existingReq = DB.accountRequests.find(function(r) { return r.username.toLowerCase() === username.toLowerCase() && r.status === 'pending'; });
        if (existingReq) {
            Swal.fire({icon:'info',title:'Request Already Pending',text:'An account request for "' + username + '" is already waiting for Admin approval.',background:'#1e293b',color:'#fff'});
            return;
        }

        var reqObj = {
            id: 'req_' + Date.now(),
            name: name,
            username: username,
            email: email,
            password: pass,
            status: 'pending',
            createdAt: new Date().toISOString()
        };
        DB.accountRequests.unshift(reqObj);
        addNotification('user', 'New Account Request', '"' + name + '" (ID: ' + username + ') requested account creation. Go to Account Management to assign access.', 'fa-user-clock', '#f59e0b');

        if (typeof scheduleFirebasePush === 'function') scheduleFirebasePush();

        // Notify Admin by email via Apps Script
        var adminEmails = DB.users.filter(function(u) { return u.role === 'admin' && u.email; }).map(function(u) { return u.email; });
        if (typeof postToAppsScript === 'function') {
            postToAppsScript({
                action: 'new_account_request',
                name: name,
                username: username,
                email: email,
                adminEmails: adminEmails
            });
        }

        state.signupName = '';
        state.signupUsername = '';
        state.signupEmail = '';
        state.authView = 'login';
        render();

        Swal.fire({
            icon: 'success',
            title: 'Request Sent to Admin!',
            html: '<div class="text-xs text-slate-300 leading-relaxed">Your account creation request for ID <strong class="text-indigo-400">' + esc(username) + '</strong> has been sent to the Admin.<br><br>Once the Admin assigns your Role and Portal Access, a confirmation Welcome Mail will be sent to <strong class="text-emerald-400">' + esc(email) + '</strong>.</div>',
            background: '#1e293b',
            color: '#fff'
        });
    }

    async function submitForgotPassword() {
        var val = (document.getElementById('forgotInput') ? document.getElementById('forgotInput').value : state.forgotUsername).trim();
        if (!val) {
            Swal.fire({icon:'warning',title:'Input Required',text:'Please enter your Username (User ID) or registered Email Address.',background:'#1e293b',color:'#fff'});
            return;
        }

        var user = DB.users.find(function(u) {
            return u.username.toLowerCase() === val.toLowerCase() || (u.email && u.email.toLowerCase() === val.toLowerCase());
        });

        if (!user) {
            Swal.fire({icon:'error',title:'Account Not Found',text:'No user account found with Username or Email "' + val + '".',background:'#1e293b',color:'#fff'});
            return;
        }
        if (!user.email || user.email.indexOf('@') === -1) {
            Swal.fire({icon:'error',title:'No Email Registered',text:'This account does not have a valid email address linked. Please contact the Admin.',background:'#1e293b',color:'#fff'});
            return;
        }

        Swal.fire({
            title: 'Sending Password...',
            text: 'Sending your password to ' + user.email + '...',
            allowOutsideClick: false,
            background: '#1e293b',
            color: '#fff',
            didOpen: function() { Swal.showLoading(); }
        });

        if (typeof postToAppsScript === 'function') {
            await postToAppsScript({
                action: 'forgot_password',
                name: user.name,
                username: user.username,
                email: user.email,
                password: user.password,
                role: user.role
            });
        }

        addNotification('auth', 'Password Recovery Requested', 'Password sent to registered email for user "' + user.username + '"', 'fa-key', '#8b5cf6');
        state.forgotUsername = '';
        state.authView = 'login';
        render();

        Swal.fire({
            icon: 'success',
            title: 'Password Sent to Your Email!',
            html: '<div class="text-xs text-slate-300 leading-relaxed">Your login password for ID <strong class="text-indigo-400">' + esc(user.username) + '</strong> has been sent to your registered email address:<br><strong class="text-emerald-400">' + esc(user.email) + '</strong></div>',
            background: '#1e293b',
            color: '#fff'
        });
    }

    function doLogin() {
        var u = (document.getElementById('loginUser') ? document.getElementById('loginUser').value : state.loginUsername).trim();
        var p = document.getElementById('loginPass') ? document.getElementById('loginPass').value : '';
        if (!u && !p) {
            Swal.fire({icon:'warning',title:'Missing Credentials',text:'Please enter both your User ID and Password.',background:'#1e293b',color:'#fff'});
            return;
        }
        if (!u) {
            Swal.fire({icon:'warning',title:'User ID Required',text:'Please enter your User ID (Username).',background:'#1e293b',color:'#fff'});
            return;
        }
        if (!p) {
            Swal.fire({icon:'warning',title:'Password Required',text:'Please enter your Password.',background:'#1e293b',color:'#fff'});
            return;
        }
        var foundUser = null;
        for (var i = 0; i < DB.users.length; i++) {
            if (DB.users[i].username === u) {
                foundUser = DB.users[i];
                break;
            }
        }
        if (!foundUser) {
            Swal.fire({icon:'error',title:'Wrong User ID',text:'User ID "' + u + '" was not found. Please check your User ID.',background:'#1e293b',color:'#fff'});
            return;
        }
        if (foundUser.password !== p) {
            Swal.fire({icon:'error',title:'Wrong Password',text:'Incorrect password entered for User ID "' + u + '". Please try again.',background:'#1e293b',color:'#fff'});
            return;
        }
        state.currentUser = foundUser;
        state.currentPortal = null;
        state.notifDropdownOpen = false;
        logActivity('Login', 'User logged in successfully', 'auth');
        addNotification('auth', 'User Logged In', foundUser.name + ' (' + foundUser.username + ') logged in', 'fa-right-to-bracket', '#10b981');
        render();
        var g = getTimeGreeting();
        Swal.fire({
            icon: 'success',
            title: g.text + ', ' + foundUser.name + '!',
            text: 'Welcome! You have successfully logged in with ID: ' + foundUser.username,
            timer: 2200,
            showConfirmButton: false,
            background: '#1e293b',
            color: '#fff'
        });
    }

    function doLogout() {
        Swal.fire({
            title: 'Are you sure to logout?',
            text: 'Do you want to logout from your account?',
            icon: 'question',
            showCancelButton: true,
            confirmButtonText: 'Yes, Logout',
            cancelButtonText: 'No',
            confirmButtonColor: '#ef4444',
            cancelButtonColor: '#475569',
            background: '#1e293b',
            color: '#fff'
        }).then(function(res) {
            if (res.isConfirmed) {
                if (state.currentUser) {
                    logActivity('Logout', 'User logged out', 'auth');
                }
                state.currentUser = null;
                state.currentPortal = null;
                state.authView = 'login';
                state.loginUsername = '';
                state.notifDropdownOpen = false;
                render();
            }
        });
    }

    function getFilteredActivityLogs() {
        var f = state.userRecordFilter;
        var logs = (DB.activityLog || []).slice();
        if (f.user && f.user !== 'all') {
            logs = logs.filter(function(l) { return l.userId === f.user || l.username === f.user; });
        }
        if (f.exactDate) {
            logs = logs.filter(function(l) {
                var d = new Date(l.timestamp);
                var isoDay = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
                return isoDay === f.exactDate;
            });
        } else {
            if (f.year && f.year !== 'all') logs = logs.filter(function(l) { return new Date(l.timestamp).getFullYear() === parseInt(f.year); });
            if (f.month && f.month !== 'all') logs = logs.filter(function(l) { return new Date(l.timestamp).getMonth() === parseInt(f.month); });
            if (f.day && f.day !== 'all') logs = logs.filter(function(l) { return new Date(l.timestamp).getDate() === parseInt(f.day); });
        }
        return logs;
    }

    function downloadActivityLog() {
        var logs = getFilteredActivityLogs();
        var portalLabelMap = { admin: 'Admin Panel', shop: 'Shop Floor Audit', actionplan: 'Action Plan Tracking', verification: 'Verification Page', actionupdate: 'Action Plan Update' };

        var logAoa = [['Date', 'Time', 'Year', 'Month', 'Day', 'User ID', 'Full Name', 'Role', 'Page / Action', 'Activity Details', 'Category']];

    function deleteStoredAuditSheet(sdId) {
        if (!state.currentUser || (state.currentUser.role !== 'admin' && state.currentUser.username !== 'admin')) {
            Swal.fire({icon:'error',title:'Admin Only',text:'Only Admin can delete audit sheets.',background:'#1e293b',color:'#fff'});
            return;
        }
        var sd = findStored(sdId);
        if (!sd) return;
        Swal.fire({
            title: 'Delete Audit Sheet?',
            text: 'Remove "' + sd.name + '" and its linked observations permanently?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Yes, Delete',
            cancelButtonText: 'Cancel',
            confirmButtonColor: '#ef4444',
            background: '#1e293b',
            color: '#fff'
        }).then(function(res) {
            if (res.isConfirmed) {
                if (typeof markIdDeleted === 'function') {
                    markIdDeleted(sd.id);
                    if (sd.auditEntryId) markIdDeleted(sd.auditEntryId);
                }
                DB.observations.forEach(function(o) {
                    if (o.storedDocId === sd.id && typeof markIdDeleted === 'function') {
                        markIdDeleted(o.id);
                    }
                });
                DB.storedDocuments = DB.storedDocuments.filter(function(d) { return d.id !== sd.id; });
                DB.audits = DB.audits.filter(function(a) { return a.id !== sd.auditEntryId; });
                DB.observations = DB.observations.filter(function(o) { return o.storedDocId !== sd.id; });
                if (state.storagePreviewId === sd.id) state.storagePreviewId = null;
                if (state.verifyingDocId === sd.id) state.verifyingDocId = null;
                logActivity('Delete Audit Sheet', 'Admin deleted audit sheet "' + sd.name + '"', 'audit');
                Swal.fire({icon:'success',title:'Deleted!',text:'Audit sheet removed.',timer:1500,background:'#1e293b',color:'#fff'});
                render();
            }
        });
    }

                var line = document.getElementById('reqLineInput').value.trim() || 'All';
                var plants = [];
                document.querySelectorAll('.req-plant-cb:checked').forEach(function(cb) { plants.push(cb.value); });
                var portals = [];
                document.querySelectorAll('.req-portal-cb:checked').forEach(function(cb) { portals.push(cb.value); });

                if (plants.length === 0) {
                    Swal.showValidationMessage('Please select at least one Plant');
                    return false;
                }
                if (portals.length === 0) {
                    Swal.showValidationMessage('Please select at least one Portal');
                    return false;
                }
                return { role: role, line: line, plants: plants, portals: portals };
            }
        }).then(function(res) {
            if (!res.isConfirmed || !res.value) return;
            var cfg = res.value;
            var newUser = {
                id: 'u' + Date.now(),
                username: req.username,
                password: req.password,
                name: req.name,
                email: req.email,
                role: cfg.role,
                allowedPortals: cfg.portals,
                plantAccess: cfg.plants,
                lineAccess: cfg.line,
                createdBy: state.currentUser ? state.currentUser.username : 'admin',
                createdAt: new Date().toISOString()
            };
            DB.users.push(newUser);
            if (typeof markIdDeleted === 'function') markIdDeleted(req.id);
            DB.accountRequests = (DB.accountRequests || []).filter(function(r) { return r.id !== req.id; });

            logActivity('Approve Account Request', 'Approved user "' + newUser.name + '" (ID: ' + newUser.username + ') as ' + newUser.role, 'general');
            addNotification('user', 'Account Approved & Created', '"' + newUser.name + '" (' + newUser.role + ') approved and Welcome Mail sent.', 'fa-user-check', '#10b981');

            sendWelcomeEmailForNewAccount(newUser);
            renderKeepScroll();

            Swal.fire({
                icon: 'success',
                title: 'Account Approved!',
                text: 'User "' + newUser.name + '" can now log in, and the Welcome Note email signed by P.Santhoshkumar has been sent.',
                background: '#1e293b',
                color: '#fff'
            });
        });
    }

    function rejectAccountRequest(reqId) {
        var req = (DB.accountRequests || []).find(function(r) { return r.id === reqId; });
        if (!req) return;
        Swal.fire({
            title: 'Reject Account Request?',
            text: 'Remove the signup request from "' + req.name + '" (' + req.username + ')?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Yes, Reject',
            confirmButtonColor: '#ef4444',
            background: '#1e293b',
            color: '#fff'
        }).then(function(res) {
            if (res.isConfirmed) {
                if (typeof markIdDeleted === 'function') markIdDeleted(req.id);
                DB.accountRequests = (DB.accountRequests || []).filter(function(r) { return r.id !== req.id; });
                logActivity('Reject Account Request', 'Rejected signup request for "' + req.username + '"', 'general');
                renderKeepScroll();
            }
        });
    }

    function saveUserAccount() { var name = document.getElementById('acctName').value.trim(); var username = document.getElementById('acctUsername').value.trim(); var password = document.getElementById('acctPassword').value; var email = document.getElementById('acctEmail').value.trim(); var role = document.getElementById('acctRole').value; var lineAccess = document.getElementById('acctLine').value.trim(); if (!name || !username || !password || !email) { Swal.fire({icon:'warning',title:'Missing Fields',text:'Please fill Name, Username, Password and Email.',background:'#1e293b',color:'#fff'}); return; } if (password.length < 4) { Swal.fire({icon:'warning',title:'Weak Password',text:'Password must be at least 4 characters.',background:'#1e293b',color:'#fff'}); return; } if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { Swal.fire({icon:'warning',title:'Invalid Email',text:'Please enter a valid email address.',background:'#1e293b',color:'#fff'}); return; } if (state.acctForm.portals.length === 0) { Swal.fire({icon:'warning',title:'No Portal Access',text:'Please select at least one portal for this user.',background:'#1e293b',color:'#fff'}); return; } if (state.acctForm.plantAccess.length === 0) { Swal.fire({icon:'warning',title:'No Plant Access',text:'Please select at least one plant for this user.',background:'#1e293b',color:'#fff'}); return; } var dup = DB.users.find(function(u){return u.username===username && u.id!==state.editingUserId;}); if (dup) { Swal.fire({icon:'error',title:'Username Taken',text:'"'+username+'" is already in use.',background:'#1e293b',color:'#fff'}); return; } if (state.editingUserId) { var u = DB.users.find(function(x){return x.id===state.editingUserId;}); if (u) { u.name = name; u.password = password; u.email = email; u.role = role; u.allowedPortals = state.acctForm.portals.slice(); u.plantAccess = state.acctForm.plantAccess.slice(); u.lineAccess = lineAccess; u.updatedAt = new Date().toISOString(); logActivity('Update User', 'Updated user "'+na     function renderResponsibilityConfig() { var doc = state.previewDoc; if (!doc) return ''; var headers = doc.columnHeaders || []; var cfg = state.templateRespConfig; var colOptions = headers.map(function(h, i) { var selected = (cfg.responsibilityColIndex === i) ? ' selected' : ''; return '<option value="'+i+'"'+selected+'>'+esc(String(h||'Column '+(i+1)))+' (Index '+i+')</option>'; }).join(''); return '<div class="bg-slate-900 p-6 rounded-2xl border border-amber-500/30 shadow-xl mt-6"><h3 class="text-lg font-bold text-amber-400 mb-1"><i class="fa-solid fa-user-tie mr-2"></i>Responsibility Column Configuration</h3><p class="text-slate-400 text-xs mb-4">Configure whether this template needs a responsibility dropdown during audits</p><div class="flex items-center gap-4 mb-4 p-4 bg-slate-950 rounded-xl border border-slate-800"><label class="flex items-center gap-3 cursor-pointer flex-1"><input type="checkbox" id="needsResp" '+(cfg.needsResponsibility?'checked':'')+' onchange="toggleRespConfig(this.checked)" class="w-5 h-5 accent-amber-500"><div><div class="text-white font-semibold text-sm">This sheet needs Responsibility assignment</div><div class="text-slate-400 text-xs">Enable dropdown for responsible person selection during audit</div></div></label></div>'+(cfg.needsResponsibility ? '<div class="p-4 bg-slate-950 rounded-xl border border-slate-800"><label class="acct-label mb-2 block">Select which column contains Responsibility data</label><select id="respColSelect" class="acct-input" onchange="state.templateRespConfig.responsibilityColIndex=parseInt(this.value)"><option value="-1">-- Select Column --</option>'+colOptions+'</select><p class="text-[10px] text-slate-500 mt-2"><i class="fa-solid fa-circle-info mr-1"></i>During audit, this column will show a dropdown of responsibility persons from the selected plant.</p></div>' : '')+'</div>'; }

    function deleteSingleObservation(obsId, evt) {
        if (evt) evt.stopPropagation();
        if (!state.currentUser || (state.currentUser.role !== 'admin' && state.currentUser.username !== 'admin')) {
            Swal.fire({icon:'error',title:'Admin Only',text:'Only Admin can delete observation points.',background:'#1e293b',color:'#fff'});
            return;
        }
        var obs = DB.observations.find(function(x) { return x.id === obsId; });
        if (!obs) return;
        Swal.fire({
            title: 'Delete Observation Point?',
            text: 'Remove "' + obs.checkpoint + '" permanently?',
            icon: 'warning',
            showCancelButton: true,
            confirmButtonText: 'Yes, Delete',
            cancelButtonText: 'Cancel',
            confirmButtonColor: '#ef4444',
            background: '#1e293b',
            color: '#fff'
        }).then(function(res) {
            if (res.isConfirmed) {
                if (typeof markIdDeleted === 'function') markIdDeleted(obsId);
                DB.observations = DB.observations.filter(function(x) { return x.id !== obsId; });
                if (state.obsDetailId === obsId) state.obsDetailId = null;
                if (typeof dbRootRef !== 'undefined' && navigator.onLine) {
                    dbRootRef.update({
                        observations: JSON.stringify(DB.observations),
                        deletedIds: JSON.stringify(deletedRegistry || {})
                    });
                }
                logActivity('Delete Observation', 'Admin deleted observation "' + obs.checkpoint + '"', 'action');
                Swal.fire({icon:'success',title:'Deleted!',timer:1400,showConfirmButton:false,background:'#1e293b',color:'#fff'});
                renderKeepScroll();
            }
        });
    }

    function renderObservationsTab() {
        // Automatically purge legacy hardcoded demo point 'obs1'
        if (DB.observations.some(function(o) { return o.id === 'obs1'; })) {
            if (typeof markIdDeleted === 'function') markIdDeleted('obs1');
            DB.observations = DB.observations.filter(function(o) { return o.id !== 'obs1'; });
        }

        if (state.obsDetailId) {
            var od = null;
            for (var i = 0; i < DB.observations.length; i++) if (DB.observations[i].id === state.obsDetailId) od = DB.observations[i];
            if (od) return renderObservationDetail(od);
            state.obsDetailId = null;
        }

        var isAdminUser = state.currentUser && (state.currentUser.role === 'admin' || state.currentUser.username === 'admin');
        var observations = DB.observations.slice();

        // Sort so the latest updated (by auditee/auditor) or latest created point is always FIRST
        observations.sort(function(a, b) {
            var tA = new Date(a.updatedAt || a.closedAt || a.createdAt || a.date || 0).getTime();
            var tB = new Date(b.updatedAt || b.closedAt || b.createdAt || b.date || 0).getTime();
            return tB - tA;
        });

        if (state.actionPlanFilter !== 'all') {
            observations = observations.filter(function(o){ return o.actionStatus === state.actionPlanFilter; });
        }

        var obsList = observations.map(function(o) {
            var statusCls = o.actionStatus === 'open' ? 'status-open' : o.actionStatus === 'progress' ? 'status-progress' : o.actionStatus === 'resolved' ? 'status-resolved' : 'status-closed';
            var statusLabel = o.actionStatus === 'open' ? 'Open' : o.actionStatus === 'progress' ? 'In Progress' : o.actionStatus === 'resolved' ? 'Resolved' : 'Closed';
            var verifiedBadge = o.auditorVerified ? '<span class="status-badge status-closed"><i class="fa-solid fa-check mr-1"></i>Verified & Closed</span>' : '';
            var reviewHint = (o.actionStatus === 'resolved' && !o.auditorVerified) ? '<span class="status-badge status-progress pulse-glow"><i class="fa-solid fa-hand-pointer mr-1"></i>Auditee Submitted Action — Click to Review</span>' : '';
            var updatedBadge = o.updatedAt ? '<span class="text-[10px] font-bold px-2 py-0.5 rounded bg-blue-500/15 text-blue-400"><i class="fa-solid fa-bolt mr-1"></i>Latest Update: '+timeAgo(o.updatedAt)+'</span>' : '';
            var adminDelBtn = isAdminUser ? '<button onclick="deleteSingleObservation(\''+o.id+'\', event)" class="w-7 h-7 rounded-lg bg-red-500/10 hover:bg-red-500/25 text-red-400 flex items-center justify-center ml-2" title="Delete Observation (Admin Only)"><i class="fa-solid fa-trash text-xs"></i></button>' : '';

            return '<div class="action-card clickable" onclick="openObsDetail(\''+o.id+'\')">' +
                '<div class="action-card-header">' +
                    '<div class="action-card-title">'+esc(o.checkpoint)+' <i class="fa-solid fa-up-right-from-square text-slate-600 text-[10px] ml-1"></i></div>' +
                    '<div class="flex items-center gap-1"><span class="status-badge '+statusCls+'">'+statusLabel+'</span>'+adminDelBtn+'</div>' +
                '</div>' +
                '<div class="text-slate-300 text-sm mb-2"><i class="fa-solid fa-comment-dots mr-1 text-indigo-400"></i>'+esc(o.observation)+'</div>' +
                '<div class="action-card-meta"><i class="fa-solid fa-user mr-1"></i>'+esc(o.responsibilityName)+' &middot; <i class="fa-solid fa-industry mr-1"></i>'+esc(o.plant)+', '+esc(o.line)+' &middot; <i class="fa-regular fa-calendar mr-1"></i>Created '+timeAgo(o.createdAt)+'</div>' +
                (o.resolutionNotes ? '<div class="mt-2 p-2 bg-indigo-500/10 border border-indigo-500/20 rounded-lg text-xs text-indigo-300"><i class="fa-solid fa-screwdriver-wrench mr-1"></i>Action Taken: '+esc(o.resolutionNotes)+'</div>' : '') +
                (o.evidence ? '<div class="mt-2 p-2 bg-emerald-500/10 border border-emerald-500/20 rounded-lg text-xs text-emerald-400"><i class="fa-solid fa-paperclip mr-1"></i>Evidence: '+esc(o.evidence)+'</div>' : '') +
                '<div class="mt-3 flex gap-2 flex-wrap items-center">'+updatedBadge+verifiedBadge+reviewHint+'</div>' +
            '</div>';
        }).join('');

        var filterBtns = ['all','open','progress','resolved','closed'].map(function(f) {
            var active = state.actionPlanFilter === f;
            var label = f === 'all' ? 'All' : f === 'open' ? 'Open' : f === 'progress' ? 'In Progress' : f === 'resolved' ? 'Resolved' : 'Closed';
            var count = f === 'all' ? DB.observations.length : DB.observations.filter(function(o){return o.actionStatus===f;}).length;
            return '<button onclick="state.actionPlanFilter=\''+f+'\';render()" class="'+(active?'bg-indigo-600 text-white':'bg-slate-800 text-slate-400 hover:bg-slate-700')+' px-3 py-1.5 rounded-lg text-xs font-bold border '+(active?'border-indigo-500':'border-slate-700')+' transition-colors">'+label+' <span class="ml-1 opacity-70">('+count+')</span></button>';
        }).join(' ');

        return '<div><div class="flex items-center justify-between mb-4"><div><h2 class="text-xl font-bold text-white">Observation Tracking</h2><p class="text-slate-400 text-xs mt-1">Sorted by latest activity first (newest auditee action updates & new points appear at the top)</p></div><div class="text-xs text-slate-400">'+DB.observations.length+' total observations</div></div><div class="flex gap-2 mb-6 flex-wrap">'+filterBtns+'</div>'+(obsList || '<div class="text-center text-slate-500 py-12"><i class="fa-regular fa-clipboard text-4xl mb-3 block"></i>No observations found</div>')+'</div>';
    }

    function openVerifyDoc(id) {
        var sd = findStored(id);
        if (!sd) return;
        state.verifyingDocId = id;
        var defaultMgr = (state.currentUser && state.currentUser.username !== 'admin') ? state.currentUser.name : '';
        state.verifiedByName = sd.verifiedByName || defaultMgr;
        state.approvedByName = sd.approvedByName || defaultMgr;
        state.verifiedBySignature = sd.verifiedBySignature || null;
        state.approvedBySignature = sd.approvedBySignature || null;
        state.verifiedByFileName = sd.verifiedByFileName || '';
        state.approvedByFileName = sd.approvedByFileName || '';
        window.auditData = sd.auditData;
        render();
    }

    function updateManagerFooterPreview(roleType, val) {
        if (roleType === 'verified') state.verifiedByName = val;
        else state.approvedByName = val;
        var sd = findStored(state.verifyingDocId);
        if (!sd) return;
        var tpl = findDoc(sd.originalDocId);
        if (tpl && tpl.footerRows) {
            tpl.footerRows.forEach(function(row, rIdx) {
                row.forEach(function(cellVal, cIdx) {
                    var txt = String(cellVal || '').toLowerCase();
                    var key = 'footer_' + rIdx + '_' + cIdx;
                    var label = String(cellVal || '').replace(/:.*$/, '').trim() + ': ';
                    if (roleType === 'verified' && txt.indexOf('verified by') !== -1) {
                        sd.auditData[key] = val.trim() ? (label + val.trim()) : cellVal;
                        var el = document.getElementById('cell-' + key);
                        if (el && el.querySelector('span')) el.querySelector('span').innerText = sd.auditData[key];
                    } else if (roleType === 'approved' && (txt.indexOf('approved by') !== -1 || txt.indexOf('approve') !== -1)) {
                        sd.auditData[key] = val.trim() ? (label + val.trim()) : cellVal;
                        var el2 = document.getElementById('cell-' + key);
                        if (el2 && el2.querySelector('span')) el2.querySelector('span').innerText = sd.auditData[key];
                    }
                });
            });
        }
    }

    function handleVerifySignatureFile(roleType, input) {
        var file = input.files && input.files[0];
        if (!file) return;
        var sizeKB = file.size / 1024;
        if (sizeKB > 100) {
            Swal.fire({icon:'error',title:'File Too Large',text:'Signature image must be under 100KB. Current: '+Math.round(sizeKB)+'KB',background:'#1e293b',color:'#fff'});
            input.value = '';
            return;
        }
        var reader = new FileReader();
        reader.onload = function(e) {
            if (roleType === 'verified') {
                state.verifiedBySignature = e.target.result;
                state.verifiedByFileName = file.name + ' (' + Math.round(sizeKB) + 'KB)';
            } else {
                state.approvedBySignature = e.target.result;
                state.approvedByFileName = file.name + ' (' + Math.round(sizeKB) + 'KB)';
            }
            logActivity('Manager Signature Upload', 'Uploaded ' + roleType + ' signature image (' + Math.round(sizeKB) + 'KB)', 'audit');
            renderKeepScroll();
        };
        reader.readAsDataURL(file);
    }

    function openVerifySignaturePad(roleType) {
        Swal.fire({
            title: roleType === 'verified' ? 'Verified By Signature' : 'Approved By Signature',
            html: '<canvas id="verifySigCanvas" class="signature-pad" width="400" height="200"></canvas><div class="text-xs text-slate-400 mt-2">Draw signature above</div>',
            showCancelButton: true,
            confirmButtonText: 'Save Signature',
            confirmButtonColor: '#8b5cf6',
            background: '#1e293b',
            color: '#fff',
            didOpen: function() {
                var canvas = document.getElementById('verifySigCanvas');
                var ctx = canvas.getContext('2d');
                ctx.strokeStyle = '#000'; ctx.lineWidth = 2; ctx.lineCap = 'round';
                var drawing = false, lx = 0, ly = 0;
                function pos(e) { var r = canvas.getBoundingClientRect(); var cx = e.touches ? e.touches[0].clientX : e.clientX; var cy = e.touches ? e.touches[0].clientY : e.clientY; return {x: cx - r.left, y: cy - r.top}; }
                canvas.addEventListener('mousedown', function(e){ drawing=true; var p=pos(e); lx=p.x; ly=p.y; });
                canvas.addEventListener('mousemove', function(e){ if(!drawing)return; var p=pos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p.x,p.y); ctx.stroke(); lx=p.x; ly=p.y; });
                canvas.addEventListener('mouseup', function(){ drawing=false; });
                canvas.addEventListener('touchstart', function(e){ e.preventDefault(); drawing=true; var p=pos(e); lx=p.x; ly=p.y; });
                canvas.addEventListener('touchmove', function(e){ e.preventDefault(); if(!drawing)return; var p=pos(e); ctx.beginPath(); ctx.moveTo(lx,ly); ctx.lineTo(p.x,p.y); ctx.stroke(); lx=p.x; ly=p.y; });
                canvas.addEventListener('touchend', function(e){ e.preventDefault(); drawing=false; });
            }
        }).then(function(r) {
            if (r.isConfirmed) {
                var dataUrl = document.getElementById('verifySigCanvas').toDataURL('image/png');
                if (roleType === 'verified') {
                    state.verifiedBySignature = dataUrl;
                    state.verifiedByFileName = 'Digital Signature';
                } else {
                    state.approvedBySignature = dataUrl;
                    state.approvedByFileName = 'Digital Signature';
                }
                renderKeepScroll();
            }
        });
    }

    function approveAndVerifySheet(sdId) {
        var sd = findStored(sdId);
        if (!sd) return;
        var tpl = findDoc(sd.originalDocId);
        var vName = (state.verifiedByName || '').trim();
        var aName = (state.approvedByName || '').trim();
        if (!vName) {
            Swal.fire({icon:'warning',title:'Manager Name Required',text:'Please enter the Verified By Manager Name.',background:'#1e293b',color:'#fff'});
            return;
        }
        if (!state.verifiedBySignature) {
            Swal.fire({icon:'warning',title:'Signature Required',text:'Please provide a Digital Signature or Upload Signature Image (max 100KB) for Verified By.',background:'#1e293b',color:'#fff'});
            return;
        }
        if (tpl && tpl.footerRows) {
            tpl.footerRows.forEach(function(row, rIdx) {
                row.forEach(function(val, cIdx) {
                    var txt = String(val || '').toLowerCase();
                    var key = 'footer_' + rIdx + '_' + cIdx;
                    var cleanLabel = String(val || '').replace(/:.*$/, '').trim() + ': ';
                    if (txt.indexOf('verified by') !== -1) {
                        sd.auditData[key] = cleanLabel + vName;
                    } else if (txt.indexOf('approved by') !== -1 || txt.indexOf('approve') !== -1) {
                        sd.auditData[key] = cleanLabel + (aName || vName);
                    }
                });
            });
        }
        sd.verifiedByName = vName;
        sd.approvedByName = aName || vName;
        sd.verifiedBySignature = state.verifiedBySignature;
        sd.approvedBySignature = state.approvedBySignature || state.verifiedBySignature;
        sd.verifiedByFileName = state.verifiedByFileName || '';
        sd.approvedByFileName = state.approvedByFileName || '';
        sd.verificationStatus = 'verified';
        sd.verifiedAt = new Date().toISOString();
        logActivity('Verify Audit', 'Verified & Approved audit "'+sd.name+'" by '+vName, 'audit');
        addNotification('audit', 'Audit Verified & Approved', '"'+sd.name+'" verified by '+vName+' and approved by '+(aName||vName), 'fa-shield-halved', '#10b981');
        state.verifyingDocId = null;
        Swal.fire({icon:'success',title:'Verified & Approved!',text:'Manager Name and Signature have been saved to the sheet.',background:'#1e293b',color:'#fff'});
        render();
    }

    // ✅ FIX 2 & 3: Signature pad functions
    function openSignaturePad(type) {
        var isAuditor = type === 'auditor';
        var title = isAuditor ? 'Auditor Signature' : 'Manager Signature';
        var color = isAuditor ? '#6366f1' : '#8b5cf6';
        
        Swal.fire({
            title: title,
            html: '<canvas id="signatureCanvas" class="signature-pad" width="400" height="200"></canvas><div class="text-xs text-slate-400 mt-2">Draw your signature above (max 10KB)</div>',
            showCancelButton: true,
            confirmButtonText: 'Save Signature',
            cancelButtonText: 'Cancel',
            confirmButtonColor: color,
            background: '#1e293b',
            color: '#fff',
            didOpen: function() {
                var canvas = document.getElementById('signatureCanvas');
                var ctx = canvas.getContext('2d');
                ctx.strokeStyle = '#000';
                ctx.lineWidth = 2;
                ctx.lineCap = 'round';
                var drawing = false;
                var lastX = 0, lastY = 0;
                
                function getPos(e) {
                    var rect = canvas.getBoundingClientRect();
                    var clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    var clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    return { x: clientX - rect.left, y: clientY - rect.top };
                }
                
                function startDraw(e) { e.preventDefault(); drawing = true; var pos = getPos(e); lastX = pos.x; lastY = pos.y; }
                function draw(e) { e.preventDefault(); if (!drawing) return; var pos = getPos(e); ctx.beginPath(); ctx.moveTo(lastX, lastY); ctx.lineTo(pos.x, pos.y); ctx.stroke(); lastX = pos.x; lastY = pos.y; }
                function stopDraw(e) { e.preventDefault(); drawing = false; }
                
                canvas.addEventListener('mousedown', startDraw);
                canvas.addEventListener('mousemove', draw);
                canvas.addEventListener('mouseup', stopDraw);
                canvas.addEventListener('mouseleave', stopDraw);
                canvas.addEventListener('touchstart', startDraw);
                canvas.addEventListener('touchmove', draw);
                canvas.addEventListener('touchend', stopDraw);
            }
        }).then(function(result) {
            if (result.isConfirmed) {
                var canvas = document.getElementById('signatureCanvas');
                var dataUrl = canvas.toDataURL('image/png');
                // Check size (approximate: base64 is ~33% larger than binary)
                var sizeKB = Math.round((dataUrl.length * 3) / 4 / 1024);
                if (sizeKB > 10) {
                    Swal.fire({icon:'error',title:'Signature Too Large',text:'Signature must be under 10KB. Current: '+sizeKB+'KB. Please draw a simpler signature.',background:'#1e293b',color:'#fff'});
                    return;
                }
                if (sizeKB < 2) {
                    Swal.fire({icon:'warning',title:'Signature Too Small',text:'Signature must be at least 2KB. Current: '+sizeKB+'KB. Please draw a more complete signature.',background:'#1e293b',color:'#fff'});
                    return;
                }
                if (isAuditor) {
                    state.auditorSignature = dataUrl;
                    logActivity('Auditor Signature', 'Captured auditor signature ('+sizeKB+'KB)', 'audit');
                } else {
                    state.managerSignature = dataUrl;
                    logActivity('Manager Signature', 'Captured manager signature ('+sizeKB+'KB)', 'audit');
                }
                render();
            }
        });
    }

    function clearAuditorSignature() { state.auditorSignature = null; render(); }
    function clearManagerSignature() { state.managerSignature = null; render(); }

    function handleAuditorFile(input) {
        var file = input.files[0];
        if (!file) return;
        var sizeKB = file.size / 1024;

            input.value = '';
            return;
        }
        state.auditorSignatureFile = file;
        logActivity('Auditor Attachment', 'Attached file "'+file.name+'" ('+Math.round(sizeKB)+'KB)', 'audit');
        render();
    }

    function verifyLogin(){
        var pass = document.getElementById('supPass').value;
        var supId = document.getElementById('supSelect').value;
        var sup = DB.supervisors.find(function(s){return s.id===supId;});
        if(!sup || pass !== sup.pass) {
            Swal.fire({icon:'error',title:'Wrong PIN',text:'Please enter the correct PIN.',background:'#1e293b',color:'#fff'});
            return;
        }
        state.supId = supId;
        logActivity('Supervisor Login', sup.name + ' (' + sup.plant + ') logged in', 'auth');
        
        // Check if photo verification is required
        if (DB.settings.requirePhotoVerification) {
            startPhotoCapture();
        } else {
            // Skip photo, go directly to audit
            navShop(6);
        }
    }

    function startPhotoCapture() {
        state.capturedPhoto = null;
        state.pendingAuditAfterPhoto = true;
        renderPhotoModal();
    }

    function renderPhotoModal() {
        var app = document.getElementById('app');
        var videoHtml = state.capturedPhoto 
            ? '<img src="'+state.capturedPhoto+'" alt="Captured">' 
            : '<video id="photoVideo" autoplay playsinline></video>';
        var btnHtml = state.capturedPhoto
            ? '<button onclick="confirmPhotoAndProceed()" class="shop-login-btn"><i class="fa-solid fa-check mr-2"></i>Confirm & Start Audit</button><button onclick="retakePhoto()" class="mt-3 w-full bg-slate-700 hover:bg-slate-600 text-white py-3 rounded-xl font-bold">Retake Photo</button>'
            : '<button onclick="capturePhoto()" class="shop-login-btn"><i class="fa-solid fa-camera mr-2"></i>Capture Photo</button><button onclick="cancelPhotoCapture()" class="mt-3 w-full bg-slate-700 hover:bg-slate-600 text-white py-3 rounded-xl font-bold">Cancel</button>';
        
        app.innerHTML = '<div class="photo-modal"><div class="photo-modal-card"><div class="text-center mb-4"><div class="w-16 h-16 rounded-2xl bg-gradient-to-br from-indigo-500 to-purple-600 flex items-center justify-center mx-auto mb-3"><i class="fa-solid fa-camera text-white text-2xl"></i></div><h2 class="text-xl font-bold text-white">Real-Time Photo Verification</h2><p class="text-slate-400 text-xs mt-1">Take a live photo to verify you are on-site before starting the audit</p></div><div class="photo-preview mb-4">'+videoHtml+'</div>'+btnHtml+'</div></div>';
        
        if (!state.capturedPhoto) {
            setTimeout(function() {
                var video = document.getElementById('photoVideo');
                if (video && navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
                    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } })
                        .then(function(stream) {
                            state.photoStream = stream;
                            video.srcObject = stream;
                        })
                        .catch(function(err) {
                            console.error('Camera error:', err);
                            Swal.fire({icon:'error',title:'Camera Access Denied',text:'Please allow camera access to take a real-time photo.',background:'#1e293b',color:'#fff'});
                            cancelPhotoCapture();
                        });
                } else {
                    Swal.fire({icon:'error',title:'Camera Not Supported',text:'Your browser does not support camera access.',background:'#1e293b',color:'#fff'});
                    cancelPhotoCapture();
                }
            }, 100);
        }
    }

    function capturePhoto() {
        var video = document.getElementById('photoVideo');
        if (!video || !video.videoWidth) {
            Swal.fire({icon:'warning',title:'Camera Not Ready',text:'Please wait for the camera to initialize.',background:'#1e293b',color:'#fff'});
            return;
        }
        var canvas = document.createElement('canvas');
        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;
        canvas.getContext('2d').drawImage(video, 0, 0);
        state.capturedPhoto = canvas.toDataURL('image/jpeg', 0.8);
        if (state.photoStream) {
            state.photoStream.getTracks().forEach(function(track) { track.stop(); });
            state.photoStream = null;
        }
        logActivity('Photo Captured', 'Real-time photo taken for audit verification', 'audit');
        renderPhotoModal();
    }

    function retakePhoto() {
        state.capturedPhoto = null;
        renderPhotoModal();
    }

    function cancelPhotoCapture() {
        if (state.photoStream) {
            state.photoStream.getTracks().forEach(function(track) { track.stop(); });
            state.photoStream = null;
        }
        state.capturedPhoto = null;
        state.pendingAuditAfterPhoto = false;
        navShop(4);
    }

    function confirmPhotoAndProceed() {
        if (!state.capturedPhoto) {
            Swal.fire({icon:'warning',title:'No Photo',text:'Please capture a photo first.',background:'#1e293b',color:'#fff'});
            return;
        }
        logActivity('Photo Verified', 'Photo confirmed, proceeding to audit', 'audit');
        addNotification('audit', 'Photo Verification Complete', 'Real-time photo captured and verified for audit', 'fa-camera', '#10b981');
        navShop(6);
    }

    // ✅ FIX 4: Submit audit with important points validation
    function submitAudit() {
        var doc = state.selectedDoc;
        var importantPoints = doc.importantPoints || [];
        
        // Check if all important points are filled
        var missingImportant = [];
        importantPoints.forEach(function(idx) {
            var cp = doc.checkpoints[idx];
            // Find the row index for this checkpoint
            var rowIdx = -1;
            for (var i = 0; i < doc.checkpoints.length; i++) {
                if (doc.checkpoints[i] === cp) { rowIdx = i; break; }
            }
            if (rowIdx >= 0) {
                // Check if observation column is filled for this row
                var headers = doc.columnHeaders || [];
                var obsColIdx = -1;
                for (var j = 0; j < headers.length; j++) {
                    if (String(headers[j]).toLowerCase().indexOf('observation') !== -1) { obsColIdx = j; break; }
                }
                if (obsColIdx >= 0) {
                    var key = rowIdx + '_' + obsColIdx;
                    var val = window.auditData[key] || '';
                    if (!val.trim()) {
                        missingImportant.push(cp);
                    }
                }
            }
        });
        
        if (missingImportant.length > 0) {
            Swal.fire({
                icon: 'error',
                title: 'Mandatory Points Missing',
                html: '<div class="text-left text-sm">The following <strong>important points</strong> must be filled before submitting:<ul class="mt-2 list-disc list-inside text-red-400">' + missingImportant.map(function(p){ return '<li>'+esc(p)+'</li>'; }).join('') + '</ul></div>',
                background: '#1e293b',
                color: '#fff',
                confirmButtonColor: '#ef4444'
            });
            return;
        }
        // Check mandatory columns
var mandatoryCols = doc.mandatoryColumns || [];
var missingMandatory = [];
mandatoryCols.forEach(function(colIdx) {
    var hasData = false;
    for (var rIdx = 0; rIdx < doc.checkpoints.length; rIdx++) {
        var key = rIdx + '_' + colIdx;
        if (window.auditData[key] && window.auditData[key].trim()) { hasData = true; break; }
    }
    if (!hasData) missingMandatory.push(doc.columnHeaders[colIdx] || 'Column ' + (colIdx + 1));
});
if (missingMandatory.length > 0) {
    Swal.fire({ icon: 'error', title: 'Mandatory Columns Empty', html: '<ul class="text-left list-disc list-inside text-red-400">' + missingMandatory.map(function(c){ return '<li>'+esc(c)+'</li>'; }).join('') + '</ul>', background: '#1e293b', color: '#fff' });
    return;
}
        
        // ✅ Check if all points require a real-time photo
        if (doc.requireAllPointsPhoto) {
            var missingPhotos = [];
            doc.checkpoints.forEach(function(cp, rIdx) {
                if (!window.auditData['pointphoto_' + rIdx]) {
                    missingPhotos.push((rIdx + 1) + '. ' + cp);
                }
            });
            if (missingPhotos.length > 0) {
                Swal.fire({
                    icon: 'warning',
                    title: 'Real-Time Point Photos Required',
                    html: '<div class="text-left text-xs">This sheet requires a live photo for every check point. Missing photos for:<ul class="mt-2 list-disc list-inside text-amber-400 max-h-40 overflow-y-auto">' + missingPhotos.map(function(p){ return '<li>'+esc(p)+'</li>'; }).join('') + '</ul></div>',
                    background: '#1e293b',
                    color: '#fff'
                });
                return;
            }
        }

        // Check signatures
        if (!state.auditorSignature && !state.auditorSignatureFile) {
            Swal.fire({icon:'warning',title:'Inspected By / Checked By Signature Required',text:'Please capture your Auditor signature or attach a photo before submitting.',background:'#1e293b',color:'#fff'});
            return;
        }

        // Stamp Inspected By / Checked By in footer if present
        if (doc.footerRows) {
            doc.footerRows.forEach(function(row, rIdx) {
                row.forEach(function(val, cIdx) {
                    var txt = String(val || '').toLowerCase();
                    if (txt.indexOf('inspected by') !== -1 || txt.indexOf('checked by') !== -1) {
                        var key = 'footer_' + rIdx + '_' + cIdx;
                        if (!window.auditData[key]) {
                            var cleanLabel = String(val || '').replace(/:.*$/, '').trim() + ': ';
                            window.auditData[key] = cleanLabel + state.currentUser.name;
                        }
                    }
                });
            });
        }
        
        var auditEntryId = 'aud_' + Date.now();
        DB.audits.push({id: auditEntryId, docId:state.selectedDoc.id, data:JSON.parse(JSON.stringify(window.auditData)), auditorName: state.currentUser.name, auditorSignature:state.auditorSignature, managerSignature:null, verificationStatus: 'pending', submittedAt: new Date().toISOString()});
        logActivity('Submit Audit', 'Submitted audit for "'+state.selectedDoc.name+'" — sent to Verification Page', 'audit');
        addNotification('audit','Audit Sent to Verification','Audit for "'+state.selectedDoc.name+'" submitted by '+state.currentUser.name+' and waiting for Manager Verification.','fa-shield-halved','#8b5cf6');
        
        var obsCol = doc.mapping.colStatus;
        var headers = doc.columnHeaders || [];
        var obsColIdx = -1, respColIdx = -1;
        for (var i = 0; i < headers.length; i++) { var h = String(headers[i]).toLowerCase(); if (h.indexOf('observation') !== -1) obsColIdx = i; if (h.indexOf('responsibility') !== -1) respColIdx = i; }
        var hasOpenObs = false;
        var hasResp = (doc.needsResponsibility || doc.hasActionPlan) && (respColIdx >= 0 || doc.hasActionPlan);
        var createdObs = [];
        // ✅ Only create Action Plan observations if sheet has Action Plan or Responsibility enabled
        if (doc.hasActionPlan || doc.needsResponsibility) {
            doc.checkpoints.forEach(function(cp, rIdx) {
                var statusKey = rIdx + '_' + obsCol;
                var status = window.auditData[statusKey] || '';
                if (status.toLowerCase() === 'not ok') {
                    var obsKey = obsColIdx >= 0 ? (rIdx + '_' + obsColIdx) : '';

    function deleteExtraColumn(docId, targetColIdx) {
        var doc = state.previewDoc || findDoc(docId) || state.selectedDoc;
        if (!doc) return;
        var curTotal = doc.mapping.totalCols;
        if (!curTotal || isNaN(curTotal)) {
            curTotal = (doc.columnHeaders ? doc.columnHeaders.length : 10);
        }
        if (curTotal <= 2) return;
        if (targetColIdx !== undefined && targetColIdx >= 0) {
            if (doc.columnHeaders) doc.columnHeaders.splice(targetColIdx, 1);
            if (doc.rowTemplates) doc.rowTemplates.forEach(function(r){ if(r.length > targetColIdx) r.splice(targetColIdx, 1); });
            if (doc.titleRows) doc.titleRows.forEach(function(r){ if(r.length > targetColIdx) r.splice(targetColIdx, 1); });
            if (doc.footerRows) doc.footerRows.forEach(function(r){ if(r.length > targetColIdx) r.splice(targetColIdx, 1); });
        }
        doc.mapping.totalCols = curTotal - 1;
        state.mapTotalCols = doc.mapping.totalCols;
        var el = document.getElementById('mapTotalCols');
        if (el) el.value = doc.mapping.totalCols;

            (rows || []).forEach(function(r) {
                for (var c = r.length - 1; c > lastUsed; c--) {
                    if (r[c] !== undefined && String(r[c]).trim() !== '') { lastUsed = c; break; }
                }
            });
        };
        if (doc.columnHeaders) checkArr([doc.columnHeaders]);
        checkArr(doc.rowTemplates);
        doc.mapping.totalCols = lastUsed + 1;

function generateAuditPDF(doc, auditData) {
    var jsPDFLib = window.jspdf.jsPDF;
    var pdfDoc = new jsPDFLib();
    pdfDoc.setFontSize(16);
    pdfDoc.text(doc.name + ' - Audit Report', 14, 20);
    pdfDoc.setFontSize(10);
    pdfDoc.text('Plant: ' + doc.plant + ' | Frequency: ' + doc.freq, 14, 28);
    pdfDoc.text('Date: ' + new Date().toLocaleDateString(), 14, 34);
    pdfDoc.text('Auditor: ' + state.currentUser.name, 14, 40);
    var headers = doc.columnHeaders || [];
    var tableData = [];
    doc.checkpoints.forEach(function(cp, rIdx) {
        var row = [cp];
        headers.forEach(function(h, cIdx) {
            if (cIdx === doc.mapping.colCP) return;
            var key = rIdx + '_' + cIdx;
            row.push(auditData[key] || '');
        });
        tableData.push(row);
    });
    var adjustedHeaders = ['Check Point'].concat(headers.filter(function(h, i){ return i !== doc.mapping.colCP; }));
    pdfDoc.autoTable({ head: [adjustedHeaders], body: tableData, startY: 50, styles: { fontSize: 8, cellPadding: 2 }, headStyles: { fillColor: [99, 102, 241] } });
    return pdfDoc.output('blob');
}

function generateFilledExcelBase64(doc, auditData) {
    if (!doc || !doc.binary) return '';
    try {
        var wb = XLSX.read(doc.binary, { type: 'array' });
        var ws = wb.Sheets[doc.sheetName];
        var D = auditData || {};
        Object.keys(D).forEach(function(key) {
            if (key.indexOf('pointphoto_') === 0) return;
            var rowIdx, c;
            if (key.indexOf('title_') === 0) { var p = key.split('_'); rowIdx = parseInt(p[1]); c = parseInt(p[2]); }
            else if (key.indexOf('footer_') === 0) { var p = key.split('_'); rowIdx = doc.footerStartRow + parseInt(p[1]); c = parseInt(p[2]); }
            else { var p = key.split('_'); rowIdx = doc.rowIndices ? doc.rowIndices[parseInt(p[0])] : (doc.mapping.startRow + parseInt(p[0])); c = parseInt(p[1]); }
            if (!isNaN(rowIdx) && !isNaN(c)) {
                ws[XLSX.utils.encode_cell({ r: rowIdx, c: c })] = { t: 's', v: String(D[key]) };
            }
        });
        return XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });
    } catch (e) {
        console.error('Excel Base64 Error:', e);
        return '';
    }
}

function generateFilledPdfBase64(doc, auditData) {
    try {
        var pdfBlob = generateAuditPDF(doc, auditData || {});
        return new Promise(function(resolve) {
            var reader = new FileReader();
            reader.onloadend = function() {
                var base64data = String(reader.result || '').split(',')[1] || '';
                resolve(base64data);
            };
            reader.onerror = function() { resolve(''); };
            reader.readAsDataURL(pdfBlob);
        });
    } catch (e) {
        console.error('PDF Base64 Error:', e);
        return Promise.resolve('');
    }
}

function postToAppsScript(payload) {
    if (!GAS_WEB_APP_URL || GAS_WEB_APP_URL.indexOf('https://script.google.com') !== 0) {
        console.warn('Apps Script URL not configured yet.');
        return Promise.resolve({ status: 'skipped' });
    }
    return fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
    })
    .then(function(res) { return res.json(); })
    .catch(function(err) {
        console.error('Apps Script Error:', err);
        return { status: 'error', message: err.message };
    });
}

function downloadAndEmailAudit() {
    var doc = state.selectedDoc;
    if (!doc) return;
    var mandatoryCols = doc.mandatoryColumns || [];
    var missingMandatory = [];
    mandatoryCols.forEach(function(colIdx) {
        var hasData = false;
        for (var rIdx = 0; rIdx < doc.checkpoints.length; rIdx++) {
            var key = rIdx + '_' + colIdx;
            if (window.auditData[key] && window.auditData[key].trim()) { hasData = true; break; }
        }
        if (!hasData) missingMandatory.push(doc.columnHeaders[colIdx] || 'Column ' + (colIdx + 1));
    });
    if (missingMandatory.length > 0) {
        Swal.fire({ icon: 'error', title: 'Mandatory Columns Empty', html: '<ul class="text-left list-disc list-inside text-red-400">' + missingMandatory.map(function(c){ return '<li>'+esc(c)+'</li>'; }).join('') + '</ul>', background: '#1e293b', color: '#fff' });
        return;
    }
    // Generate Excel
    var wb = XLSX.read(doc.binary, {type:'array'});
    var ws = wb.Sheets[doc.sheetName];
    Object.keys(window.auditData).forEach(function(key) {
        var rowIdx, c;
        if (key.indexOf('title_')===0) { var p=key.split('_'); rowIdx=parseInt(p[1]); c=parseInt(p[2]); }
        else if (key.indexOf('footer_')===0) { var p=key.split('_'); rowIdx=doc.footerStartRow+parseInt(p[1]); c=parseInt(p[2]); }
        else { var p=key.split('_'); rowIdx=doc.rowIndices?doc.rowIndices[parseInt(p[0])]:(doc.mapping.startRow+parseInt(p[0])); c=parseInt(p[1]); }
        ws[XLSX.utils.encode_cell({r:rowIdx,c:c})]={t:'s',v:window.auditData[key]};
    });
    XLSX.writeFile(wb, doc.name + '_Audit_' + new Date().toISOString().slice(0,10) + '.xlsx');
    // Generate PDF
    try {
        var pdfBlob = generateAuditPDF(doc, window.auditData);
        var pdfUrl = URL.createObjectURL(pdfBlob);
        var a = document.createElement('a'); a.href = pdfUrl; a.download = doc.name + '_Audit_' + new Date().toISOString().slice(0,10) + '.pdf'; a.click();

        return openLocalIDB().then(function(idb) {
            return new Promise(function(resolve) {
                if (!idb) {
                    var light = localStorage.getItem('SAFETY_AUDIT_LIGHT_CACHE_V30');
                    resolve(light ? JSON.parse(light) : null);
                    return;
                }
                try {
                    var tx = idb.transaction(IDB_STORE, 'readonly');
                    var getReq = tx.objectStore(IDB_STORE).get('fullDB');
                    getReq.onsuccess = function() {
                        if (getReq.result) resolve(getReq.result);
                        else {
                            var light = localStorage.getItem('SAFETY_AUDIT_LIGHT_CACHE_V30');
                            resolve(light ? JSON.parse(light) : null);
                        }
                    };
                    getReq.onerror = function() { resolve(null); };
                } catch (e) { resolve(null); }
            });
        });
    }

    // ============================================================
    // 2. SESSION PERSISTENCE (RESUME AUDIT ON PHONE CALL / APP SWITCH) & 4.5-MIN AUTO-LOGOUT

    var SESSION_STORAGE_KEY = 'SAFETY_AUDIT_ACTIVE_SESSION_V30';
    var INACTIVITY_LIMIT_MS = 4.5 * 60 * 1000; // 4.5 Minutes (270 seconds)
    var lastActivityTime = Date.now();

    function isAuditInProgress() {
        return !!(state.currentUser && state.currentPortal === 'shop' && state.shopStep >= 2);

    function saveActiveSessionToLocal() {
        try {
            if (!state.currentUser) {
                localStorage.removeItem(SESSION_STORAGE_KEY);
                return;
            }
            var sessionObj = {
                userId: state.currentUser.id,
                username: state.currentUser.username,
                currentPortal: state.currentPortal,
                adminTab: state.adminTab,

    function restoreActiveSessionFromLocal() {
        try {
            var raw = localStorage.getItem(SESSION_STORAGE_KEY);
            if (!raw) return false;
            var s = JSON.parse(raw);
            if (!s || !s.username) return false;

            var elapsed = Date.now() - (s.lastActivityTime || Date.now());
            var wasInAudit = (s.currentPortal === 'shop' && s.shopStep >= 2);

            // If not in an active audit and idle > 4.5 mins, expire session
            if (!wasInAudit && elapsed > INACTIVITY_LIMIT_MS) {
                localStorage.removeItem(SESSION_STORAGE_KEY);
                return false;
            }

            var foundUser = DB.users.find(function(u) { return u.id === s.userId || u.username === s.username; });
            if (!foundUser) return false;

            state.currentUser = foundUser;
            state.currentPortal = s.currentPortal || null;
            state.adminTab = s.adminTab || 'builder';
            state.shopStep = s.shopStep || 1;
            state.selectedPlant = s.selectedPlant || null;
            state.selectedFreq = s.selectedFreq || null;
            state.supId = s.supId || null;
            state.capturedPhoto = s.capturedPhoto || null;
            state.auditorSignature = s.auditorSignature || null;
            state.verifyingDocId = s.verifyingDocId || null;
            state.verifiedByName = s.verifiedByName || '';
            state.approvedByName = s.approvedByName || '';
            state.verifiedBySignature = s.verifiedBySignature || null;
            state.approvedBySignature = s.approvedBySignature || null;
            window.auditData = s.auditData || {};

            if (s.selectedDocId) {
                var doc = findDoc(s.selectedDocId);
                if (doc) {
                    state.selectedDoc = doc;
                    state.importantPoints = doc.importantPoints || [];
                }
            }
            lastActivityTime = Date.now();
            return true;
        } catch (e) {
            return false;
        }
    }

    // When returning from a Phone Call or switching back from another app
    document.addEventListener('visibilitychange', function() {
