    // ============================================================
    // 3. EXCEL BINARY <-> BASE64 & CLOUDINARY UPLOAD
    // ============================================================
    function binaryToBase64(bin) {
        if (!bin) return '';
        var bytes = bin instanceof ArrayBuffer ? new Uint8Array(bin) : (ArrayBuffer.isView(bin) ? new Uint8Array(bin.buffer) : new Uint8Array(bin));
        var binaryStr = '';
        var chunkSize = 8192;
        for (var i = 0; i < bytes.length; i += chunkSize) {
            binaryStr += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
        }
        return btoa(binaryStr);
    }

    function base64ToBinary(b64) {
        if (!b64) return null;
        var binaryStr = atob(b64);
        var len = binaryStr.length;
        var bytes = new Uint8Array(len);
        for (var i = 0; i < len; i++) {
            bytes[i] = binaryStr.charCodeAt(i);
        }
        return bytes;
    }

    function uploadToCloudinary(fileOrDataUrl) {
        if (!fileOrDataUrl) return Promise.resolve(null);
        if (typeof fileOrDataUrl === 'string' && fileOrDataUrl.indexOf('http') === 0) {
            return Promise.resolve(fileOrDataUrl);
        }
        if (!navigator.onLine) {
            // Keep Base64 locally while offline; it will auto-upload when online
            hasPendingOfflineChanges = true;
            return Promise.resolve(typeof fileOrDataUrl === 'string' ? fileOrDataUrl : null);
        }
        var url = 'https://api.cloudinary.com/v1_1/' + CLOUDINARY_CONFIG.cloudName + '/auto/upload';
        var formData = new FormData();
        formData.append('file', fileOrDataUrl);
        formData.append('upload_preset', CLOUDINARY_CONFIG.uploadPreset);
        formData.append('folder', CLOUDINARY_CONFIG.folder);

        return fetch(url, { method: 'POST', body: formData })
            .then(function(res) { return res.json(); })
            .then(function(data) {
                if (data && data.secure_url) return data.secure_url;
                return typeof fileOrDataUrl === 'string' ? fileOrDataUrl : null;
            })
            .catch(function() {
                hasPendingOfflineChanges = true;
                return typeof fileOrDataUrl === 'string' ? fileOrDataUrl : null;
            });
    }

    async function uploadPendingImagesToCloudinary() {
        if (!navigator.onLine) return false;
        var changed = false;

        if (state.capturedPhoto && state.capturedPhoto.indexOf('data:') === 0) {
            state.capturedPhoto = await uploadToCloudinary(state.capturedPhoto);
        }
        if (state.auditorSignature && state.auditorSignature.indexOf('data:') === 0) {
            state.auditorSignature = await uploadToCloudinary(state.auditorSignature);
        }
        if (state.verifiedBySignature && state.verifiedBySignature.indexOf('data:') === 0) {
            state.verifiedBySignature = await uploadToCloudinary(state.verifiedBySignature);
        }
        if (state.approvedBySignature && state.approvedBySignature.indexOf('data:') === 0) {
            state.approvedBySignature = await uploadToCloudinary(state.approvedBySignature);
        }

        if (window.auditData) {
            var aKeys = Object.keys(window.auditData);
            for (var k = 0; k < aKeys.length; k++) {
                var key = aKeys[k];
                var val = window.auditData[key];
                if (key.indexOf('pointphoto_') === 0 && typeof val === 'string' && val.indexOf('data:') === 0) {
                    window.auditData[key] = await uploadToCloudinary(val);
                    changed = true;
                }
            }
        }

        for (var i = 0; i < DB.storedDocuments.length; i++) {
            var sd = DB.storedDocuments[i];
            if (sd.auditorSignature && sd.auditorSignature.indexOf('data:') === 0) {
                sd.auditorSignature = await uploadToCloudinary(sd.auditorSignature);
                changed = true;
            }
            if (sd.verifiedBySignature && sd.verifiedBySignature.indexOf('data:') === 0) {
                sd.verifiedBySignature = await uploadToCloudinary(sd.verifiedBySignature);
                changed = true;
            }
            if (sd.approvedBySignature && sd.approvedBySignature.indexOf('data:') === 0) {
                sd.approvedBySignature = await uploadToCloudinary(sd.approvedBySignature);
                changed = true;
            }
            if (sd.auditData) {
                var sdKeys = Object.keys(sd.auditData);
                for (var j = 0; j < sdKeys.length; j++) {
                    var sk = sdKeys[j];
                    if (sk.indexOf('pointphoto_') === 0 && typeof sd.auditData[sk] === 'string' && sd.auditData[sk].indexOf('data:') === 0) {
                        sd.auditData[sk] = await uploadToCloudinary(sd.auditData[sk]);
                        changed = true;
                    }
                }
            }
        }

        for (var m = 0; m < DB.observations.length; m++) {
            var obs = DB.observations[m];
            if (obs.evidenceDataUrl && obs.evidenceDataUrl.indexOf('data:') === 0) {
                obs.evidenceDataUrl = await uploadToCloudinary(obs.evidenceDataUrl);
                changed = true;
            }
        }
        return changed;
    }

    handleAuditorFile = function(input) {
        var file = input.files && input.files[0];
        if (!file) return;
        var sizeKB = file.size / 1024;
        if (sizeKB > 100) {
            Swal.fire({icon:'error',title:'File Too Large',text:'Photo must be under 100KB. Current: '+Math.round(sizeKB)+'KB',background:'#1e293b',color:'#fff'});
            input.value = '';
            return;
        }
        state.auditorSignatureFile = file;
        var reader = new FileReader();
        reader.onload = function(e) {
            state.auditorSignature = e.target.result;
            uploadToCloudinary(state.auditorSignature).then(function(url) {
                if (url) state.auditorSignature = url;
                saveActiveSessionToLocal();
                render();
            });
        };
        reader.readAsDataURL(file);
    };

    // ============================================================
    // 4. MULTI-USER NON-DESTRUCTIVE SMART MERGE & ANTI-ERASE ENGINE
    // ============================================================
    // Track intentional Admin deletions so merging never resurrects intentionally deleted items,
    // while NEVER allowing accidental data erasure when offline/multi-user.
    function markIdDeleted(id) {
        if (!id) return;
        deletedRegistry[id] = Date.now();
        localStorage.setItem('SAFETY_AUDIT_DELETED_IDS_V30', JSON.stringify(deletedRegistry));
    }

    var _origDeleteDoc = deleteDocument;
    deleteDocument = function(docId) { markIdDeleted(docId); _origDeleteDoc(docId); };
    var _origDeleteUser = deleteUser;
    deleteUser = function(uid) { markIdDeleted(uid); _origDeleteUser(uid); };
    var _origDeleteResp = deleteResponsibility;
    deleteResponsibility = function(rid) { markIdDeleted(rid); _origDeleteResp(rid); };
    var _origDeleteSup = deleteSupervisor;
    deleteSupervisor = function(sid) { markIdDeleted(sid); _origDeleteSup(sid); };

    function getItemTimestamp(item) {
        if (!item) return 0;
        var t = item.verifiedAt || item.closedAt || item.updatedAt || item.lastSyncedAt || item.storedAt || item.submittedAt || item.createdAt || item.timestamp || item.time;
        return t ? new Date(t).getTime() : 0;
    }

    function mergeArraysById(remoteArr, localArr) {
        var rList = Array.isArray(remoteArr) ? remoteArr : [];
        var lList = Array.isArray(localArr) ? localArr : [];
        var map = {};
        var order = [];

        rList.forEach(function(item) {
            if (!item || !item.id) return;
            if (deletedRegistry[item.id]) return;
            map[item.id] = item;
            order.push(item.id);
        });

        lList.forEach(function(item) {
            if (!item || !item.id) return;
            if (deletedRegistry[item.id]) return;
            if (!map[item.id]) {
                map[item.id] = item;
                order.push(item.id);
            } else {
                var existing = map[item.id];
                var rTime = getItemTimestamp(existing);
                var lTime = getItemTimestamp(item);
                // Merge nested auditData keys so 2 users editing never lose cells
                var mergedAuditData = null;
                if (existing.auditData || item.auditData) {
                    mergedAuditData = Object.assign({}, existing.auditData || {}, item.auditData || {});
                }
                if (lTime >= rTime) {
                    map[item.id] = Object.assign({}, existing, item);
                } else {
                    map[item.id] = Object.assign({}, item, existing);
                }
                if (mergedAuditData) map[item.id].auditData = mergedAuditData;
            }
        });

        return order.map(function(id) { return map[id]; });
    }

    function mergeStringArrays(remoteArr, localArr) {
        var combined = (Array.isArray(remoteArr) ? remoteArr : []).concat(Array.isArray(localArr) ? localArr : []);
        return combined.filter(function(v, i, a) { return v && a.indexOf(v) === i; });
    }

    function serializeDBForFirebase() {
        var docsFormatted = (DB.documents || []).map(function(d) {
            var b64 = d.binaryBase64 || binaryToBase64(d.binary);
            d.binaryBase64 = b64;
            return {
                id: d.id,
                name: d.name,
                plant: d.plant,
                freq: d.freq,
                sheetName: d.sheetName || 'Sheet1',
                binaryBase64: b64,
                updatedAt: d.updatedAt || d.createdAt || new Date().toISOString(),
                templateJson: JSON.stringify({
                    mapping: d.mapping,
                    checkpoints: d.checkpoints || [],
                    rowTemplates: d.rowTemplates || [],
                    rowIndices: d.rowIndices || [],
                    columnHeaderRowIndex: d.columnHeaderRowIndex,
                    columnHeaders: d.columnHeaders || [],
                    titleRows: d.titleRows || [],
                    footerRows: d.footerRows || [],
                    footerStartRow: d.footerStartRow,
                    merges: d.merges || [],
                    needsResponsibility: !!d.needsResponsibility,
                    responsibilityColIndex: d.responsibilityColIndex !== undefined ? d.responsibilityColIndex : -1,
                    hasActionPlan: !!d.hasActionPlan,
                    requireAllPointsPhoto: !!d.requireAllPointsPhoto,
                    customColWidth: d.customColWidth || 120,
                    importantPoints: d.importantPoints || [],
                    mandatoryColumns: d.mandatoryColumns || []
                })
            };
        });

        return {
            supervisors: JSON.stringify(DB.supervisors || []),
            users: JSON.stringify(DB.users || []),
            accountRequests: JSON.stringify(DB.accountRequests || []),
            responsibilities: JSON.stringify(DB.responsibilities || []),
            observations: JSON.stringify(DB.observations || []),
            audits: JSON.stringify(DB.audits || []),
            storedDocuments: JSON.stringify(DB.storedDocuments || []),
            documents: JSON.stringify(docsFormatted),
            activityLog: JSON.stringify((DB.activityLog || []).slice(0, 300)),
            notifications: JSON.stringify((DB.notifications || []).slice(0, 50)),
            settings: DB.settings || { requirePhotoVerification: true },
            plants: JSON.stringify(DB.plants || ['CCP', 'CTP']),
            frequencies: JSON.stringify(DB.frequencies || ['daily', 'monthly']),
            emailLists: JSON.stringify(DB.emailLists || {}),
            deletedIds: JSON.stringify(deletedRegistry || {}),
            lastUpdatedAt: new Date().toISOString()
        };
    }

    function parseArrayField(field) {
        if (!field) return [];
        if (Array.isArray(field)) return field;
        try { return JSON.parse(field); } catch (e) { return []; }
    }

    function parseObjectField(field, fallback) {
        if (!field) return fallback || {};
        if (typeof field === 'object') return field;
        try { return JSON.parse(field); } catch (e) { return fallback || {}; }
    }

    // Merge remote Firebase snapshot with local DB so ZERO data is ever lost
    function mergeFirebaseSnapshotIntoLocalDB(val) {
        if (!val) return;
        try {
            var remoteDeleted = parseObjectField(val.deletedIds, {});
            deletedRegistry = Object.assign({}, remoteDeleted, deletedRegistry);

            DB.supervisors = mergeArraysById(parseArrayField(val.supervisors), DB.supervisors);
            DB.users = mergeArraysById(parseArrayField(val.users), DB.users);
            DB.accountRequests = mergeArraysById(parseArrayField(val.accountRequests), DB.accountRequests || []);
            DB.responsibilities = mergeArraysById(parseArrayField(val.responsibilities), DB.responsibilities);
            DB.observations = mergeArraysById(parseArrayField(val.observations), DB.observations);
            DB.audits = mergeArraysById(parseArrayField(val.audits), DB.audits);
            DB.storedDocuments = mergeArraysById(parseArrayField(val.storedDocuments), DB.storedDocuments);
            DB.activityLog = mergeArraysById(parseArrayField(val.activityLog), DB.activityLog).slice(0, 300);
            DB.notifications = mergeArraysById(parseArrayField(val.notifications), DB.notifications).slice(0, 50);

            if (val.settings) {
                var rSetTime = val.settings.updatedAt ? new Date(val.settings.updatedAt).getTime() : 0;
                var lSetTime = (DB.settings && DB.settings.updatedAt) ? new Date(DB.settings.updatedAt).getTime() : 0;
                if (rSetTime > lSetTime) {
                    DB.settings = Object.assign({}, DB.settings, val.settings);
                }
            }
            DB.plants = mergeStringArrays(parseArrayField(val.plants), DB.plants);
            DB.frequencies = mergeStringArrays(parseArrayField(val.frequencies), DB.frequencies);
            DB.emailLists = Object.assign({}, parseObjectField(val.emailLists, {}), DB.emailLists);

            var remoteRawDocs = parseArrayField(val.documents);
            var remoteDocsHydrated = remoteRawDocs.map(function(d) {
                var meta = d.templateJson ? parseObjectField(d.templateJson, {}) : d;
                return Object.assign({}, d, meta, {
                    binary: base64ToBinary(d.binaryBase64),
                    binaryBase64: d.binaryBase64
                });
            });
            DB.documents = mergeArraysById(remoteDocsHydrated, DB.documents);

            if (state.currentUser) {
                var updatedUser = DB.users.find(function(u) { return u.id === state.currentUser.id || u.username === state.currentUser.username; });
                if (updatedUser) state.currentUser = updatedUser;
            }
            if (state.selectedDoc) {
                var updatedDoc = findDoc(state.selectedDoc.id);
                if (updatedDoc) state.selectedDoc = updatedDoc;
            }

            savePayloadToLocalCache(serializeDBForFirebase());
        } catch (err) {
            console.error('Error merging Firebase snapshot:', err);
        }
    }

    // Safe Multi-User Sync: Reads latest remote state, merges with local, and updates without ever erasing
    function scheduleFirebasePush() {
        var currentSnap = serializeDBForFirebase();
        savePayloadToLocalCache(currentSnap);
        saveActiveSessionToLocal();

        if (!navigator.onLine || !isOnlineConnected) {
            hasPendingOfflineChanges = true;
            updateSyncBadgeUI();
            return;
        }
        if (isApplyingRemoteUpdate || isSyncingNow) return;
        if (syncTimer) clearTimeout(syncTimer);

        syncTimer = setTimeout(async function() {
            if (!navigator.onLine) {
                hasPendingOfflineChanges = true;
                updateSyncBadgeUI();
                return;
            }
            isSyncingNow = true;
            updateSyncBadgeUI();
            try {
                await uploadPendingImagesToCloudinary();
                var snap = await dbRootRef.once('value');
                var remoteVal = snap.val();
                if (remoteVal) {
                    // Merge remote + local first so we NEVER overwrite another user's concurrent changes
                    mergeFirebaseSnapshotIntoLocalDB(remoteVal);
                }
                var mergedPayload = serializeDBForFirebase();
                await dbRootRef.update(mergedPayload);
                hasPendingOfflineChanges = false;
                savePayloadToLocalCache(mergedPayload);
            } catch (err) {
                console.error('Safe Firebase Sync Error:', err);
                hasPendingOfflineChanges = true;
            }
            isSyncingNow = false;
            updateSyncBadgeUI();
        }, 400);
    }

        isOnlineConnected = !!snap.val();
        updateSyncBadgeUI();
        if (isOnlineConnected && hasPendingOfflineChanges) {
            scheduleFirebasePush();
        }
    });

    // Hook into render so scroll position & active input focus NEVER jump to top
    var _rawRender = render;
    var _baseRender = function() {
        var adminScrollEl = document.getElementById('adminContentScroll');
        var savedAdminTop = adminScrollEl ? adminScrollEl.scrollTop : 0;
        var activeId = document.activeElement ? document.activeElement.id : null;
        var selStart = null, selEnd = null;
        try {
            if (document.activeElement && typeof document.activeElement.selectionStart === 'number') {
                selStart = document.activeElement.selectionStart;
                selEnd = document.activeElement.selectionEnd;
            }
        } catch (e) {}

        _rawRender();

        var adminScrollElAfter = document.getElementById('adminContentScroll');
        if (adminScrollElAfter && savedAdminTop > 0) {
            adminScrollElAfter.scrollTop = savedAdminTop;
        }
        if (activeId) {
            var focusEl = document.getElementById(activeId);
            if (focusEl) {
                try {
                    focusEl.focus({ preventScroll: true });
                    if (selStart !== null && typeof focusEl.setSelectionRange === 'function') {
                        focusEl.setSelectionRange(selStart, selEnd);
                    }
                } catch (e) {}
            }
        }
    };

    render = function() {
        _baseRender();
        saveActiveSessionToLocal();
        scheduleFirebasePush();
    };

    var _baseLogActivity = logActivity;
    logActivity = function(action, detail, type) {
        _baseLogActivity(action, detail, type);
        scheduleFirebasePush();
    };

    var _baseAddNotification = addNotification;
    addNotification = function(type, title, desc, icon, color) {
        _baseAddNotification(type, title, desc, icon, color);
        scheduleFirebasePush();
    };

    // ============================================================
    // 6. INITIAL BOOTSTRAP: LOAD OFFLINE CACHE FIRST, THEN LIVE FIREBASE
    // ============================================================
    loadPayloadFromLocalCache().then(function(cachedPayload) {
        if (cachedPayload) {
            mergeFirebaseSnapshotIntoLocalDB(cachedPayload);
        }
        restoreActiveSessionFromLocal();
        _baseRender();

        // Attach Real-Time Listener from Firebase
        dbRootRef.on('value', function(snapshot) {
            var val = snapshot.val();
            if (!val) {
                isFirebaseLoaded = true;
                var initPayload = serializeDBForFirebase();
                dbRootRef.update(initPayload);
                return;
            }
            isApplyingRemoteUpdate = true;
            mergeFirebaseSnapshotIntoLocalDB(val);
            if (!state.currentUser) {
                restoreActiveSessionFromLocal();
            }
            isFirebaseLoaded = true;
            _baseRender();
            isApplyingRemoteUpdate = false;
        });
    });

    // ============================================================
    // 📧 AUTO-TRIGGER APPS SCRIPT WITH TO/CC SELECTION POPUP ON SUBMIT
    // ============================================================
    function buildReadableAuditSummary(doc, auditData) {
        if (!doc || !doc.checkpoints) return '';
        var D = auditData || {};
        var stCol = doc.mapping.colStatus;
        var headers = doc.columnHeaders || [];
        var obsColIdx = -1, respColIdx = -1;
        for (var i = 0; i < headers.length; i++) {
            var h = String(headers[i]).toLowerCase();
            if (h.indexOf('observation') !== -1) obsColIdx = i;
            if (h.indexOf('responsibility') !== -1) respColIdx = i;
        }
        var lines = [];
        doc.checkpoints.forEach(function(cp, rIdx) {
            var st = D[rIdx + '_' + stCol] || 'Not Marked';
            var obsTxt = (obsColIdx >= 0 && D[rIdx + '_' + obsColIdx]) ? (' | Obs: ' + D[rIdx + '_' + obsColIdx]) : '';
            var respTxt = (respColIdx >= 0 && D[rIdx + '_' + respColIdx]) ? (' | Resp: ' + D[rIdx + '_' + respColIdx]) : '';
            lines.push((rIdx + 1) + '. ' + cp + ' -> ' + st + obsTxt + respTxt);
        });
        return lines.join(' ; ');
    }

    var _origOpenEmailModal = openEmailModal;
    openEmailModal = function(auditData) {
        _origOpenEmailModal(auditData);
        if (state.emailModal && state.emailModal.message && state.emailModal.message.indexOf('Thanks & Regards') === -1) {
            state.emailModal.message += '\n\nThanks & Regards,\nSafety Team';
        }
    };

    var _origSubmitAuditForGAS = submitAudit;
    submitAudit = async function() {
        var docBefore = state.selectedDoc;
        if (!docBefore) return;

        // Gather all available TO and CC emails for this Plant + Responsible Persons + Line HOD/Plant Head
        var plantEmails = DB.emailLists[docBefore.plant] || { to: [], cc: [] };
        var defaultTo = (plantEmails.to || []).slice();
        var defaultCc = (plantEmails.cc || []).slice();

        var headers = docBefore.columnHeaders || [];
        var respColIdx = -1;
        for (var i = 0; i < headers.length; i++) {
            if (String(headers[i]).toLowerCase().indexOf('responsibility') !== -1) { respColIdx = i; break; }
        }

        // Include Responsible Person TO & their HOD/Plant Head CC emails
        DB.responsibilities.filter(function(r) { return r.plant === docBefore.plant; }).forEach(function(r) {
            if (r.email && defaultTo.indexOf(r.email) === -1) {
                // Check if this person was selected on any row
                var wasSelected = false;
                if (respColIdx >= 0) {
                    docBefore.checkpoints.forEach(function(_, rIdx) {
                        var val = window.auditData[rIdx + '_' + respColIdx] || '';
                        if (val.toLowerCase().indexOf(r.name.toLowerCase()) !== -1) wasSelected = true;
                    });
                }
                if (wasSelected && defaultTo.indexOf(r.email) === -1) defaultTo.push(r.email);
            }
            if (r.ccEmails) {
                r.ccEmails.split(',').forEach(function(ccEm) {
                    var clean = ccEm.trim();
                    if (clean && defaultCc.indexOf(clean) === -1) defaultCc.push(clean);
                });
            }
        });

        var allCandidateEmails = [];
        defaultTo.concat(defaultCc).forEach(function(e) {
            if (e && allCandidateEmails.indexOf(e) === -1) allCandidateEmails.push(e);
        });
        DB.responsibilities.forEach(function(r) {
            if (r.email && allCandidateEmails.indexOf(r.email) === -1) allCandidateEmails.push(r.email);
            if (r.ccEmails) {
                r.ccEmails.split(',').forEach(function(c) {
                    var cl = c.trim();
                    if (cl && allCandidateEmails.indexOf(cl) === -1) allCandidateEmails.push(cl);
                });
            }
        });
        DB.users.forEach(function(u) {
            if (u.email && allCandidateEmails.indexOf(u.email) === -1) allCandidateEmails.push(u.email);
        });

        var toCheckboxes = allCandidateEmails.map(function(em, idx) {
            var chk = defaultTo.indexOf(em) !== -1 ? 'checked' : '';
            return '<label class="flex items-center gap-2 p-1.5 hover:bg-slate-800 rounded cursor-pointer text-xs text-slate-200"><input type="checkbox" class="submit-to-cb accent-blue-500" value="'+esc(em)+'" '+chk+'><span>'+esc(em)+'</span></label>';
        }).join('');

        var ccCheckboxes = allCandidateEmails.map(function(em, idx) {
            var chk = defaultCc.indexOf(em) !== -1 ? 'checked' : '';
            return '<label class="flex items-center gap-2 p-1.5 hover:bg-slate-800 rounded cursor-pointer text-xs text-slate-200"><input type="checkbox" class="submit-cc-cb accent-purple-500" value="'+esc(em)+'" '+chk+'><span>'+esc(em)+'</span></label>';
        }).join('');

        var popupRes = await Swal.fire({
            title: 'Select Email Recipients (TO & CC)',
            html: '<div class="text-left space-y-3">' +
                '<p class="text-xs text-slate-400">Select who should receive the Audit Sheet & Observation Alert emails. You can also type extra emails below so no important person is missed.</p>' +
                '<div class="grid grid-cols-1 md:grid-cols-2 gap-3">' +
                    '<div class="bg-slate-950 p-3 rounded-xl border border-blue-500/30">' +
                        '<div class="text-xs font-bold text-blue-400 uppercase mb-2"><i class="fa-solid fa-user-check mr-1"></i>TO Recipients</div>' +
                        '<div class="max-h-36 overflow-y-auto custom-scrollbar space-y-1 mb-2">' + (toCheckboxes || '<div class="text-xs text-slate-500">No saved emails</div>') + '</div>' +
                        '<input type="text" id="extraSubmitTo" class="swal2-input !m-0 !w-full !text-xs !h-9" placeholder="Add extra TO (comma separated)">' +
                    '</div>' +
                    '<div class="bg-slate-950 p-3 rounded-xl border border-purple-500/30">' +
                        '<div class="text-xs font-bold text-purple-400 uppercase mb-2"><i class="fa-solid fa-users mr-1"></i>CC (HOD / Plant Head)</div>' +
                        '<div class="max-h-36 overflow-y-auto custom-scrollbar space-y-1 mb-2">' + (ccCheckboxes || '<div class="text-xs text-slate-500">No saved CC emails</div>') + '</div>' +
                        '<input type="text" id="extraSubmitCc" class="swal2-input !m-0 !w-full !text-xs !h-9" placeholder="Add extra CC (comma separated)">' +
                    '</div>' +
                '</div>' +
                '<div class="p-2.5 rounded-lg bg-slate-900 border border-slate-800 text-[11px] text-slate-400">' +
                    'Email Footer: <strong class="text-emerald-400">Thanks &amp; Regards, Safety Team</strong>' +
                '</div>' +
            '</div>',
            width: 680,
            showCancelButton: true,
            confirmButtonText: '<i class="fa-solid fa-paper-plane mr-1"></i>Confirm & Submit Audit',
            cancelButtonText: 'Back to Audit',
            confirmButtonColor: '#4f46e5',
            background: '#1e293b',
            color: '#fff',
            preConfirm: function() {
                var selectedTo = [];
                document.querySelectorAll('.submit-to-cb:checked').forEach(function(cb) { selectedTo.push(cb.value); });
                var extraTo = document.getElementById('extraSubmitTo') ? document.getElementById('extraSubmitTo').value : '';
                extraTo.split(',').forEach(function(e) { var c = e.trim(); if (c && selectedTo.indexOf(c) === -1) selectedTo.push(c); });

                var selectedCc = [];
                document.querySelectorAll('.submit-cc-cb:checked').forEach(function(cb) { selectedCc.push(cb.value); });
                var extraCc = document.getElementById('extraSubmitCc') ? document.getElementById('extraSubmitCc').value : '';
                extraCc.split(',').forEach(function(e) { var c = e.trim(); if (c && selectedCc.indexOf(c) === -1) selectedCc.push(c); });

                return { to: selectedTo, cc: selectedCc };
            }
        });

        if (!popupRes.isConfirmed) return;

        var chosenTo = popupRes.value.to || [];
        var chosenCc = popupRes.value.cc || [];
        var dataSnapshot = JSON.parse(JSON.stringify(window.auditData || {}));
        var prevStoredLen = DB.storedDocuments.length;

        _origSubmitAuditForGAS();

        if (docBefore && DB.storedDocuments.length > prevStoredLen) {
            var latestStored = DB.storedDocuments[DB.storedDocuments.length - 1];
            var finalAuditData = latestStored.auditData || dataSnapshot;

            var relatedObs = DB.observations.filter(function(o) { return o.storedDocId === latestStored.id; }).map(function(o) {
                var respObj = DB.responsibilities.find(function(r) {
                    return r.id === o.responsibilityId || r.name.toLowerCase() === String(o.responsibilityName || '').toLowerCase();
                });
                var rEmail = respObj ? respObj.email : '';
                var rCc = respObj ? (respObj.ccEmails || '') : '';
                if (rEmail && chosenTo.indexOf(rEmail) === -1) chosenTo.push(rEmail);
                return Object.assign({}, o, {
                    responsibilityEmail: rEmail,
                    responsibilityCc: rCc
                });
            });

            var excelB64 = generateFilledExcelBase64(docBefore, finalAuditData);
            var pdfB64 = await generateFilledPdfBase64(docBefore, finalAuditData);
            var readableSummary = buildReadableAuditSummary(docBefore, finalAuditData);

            // Calculate Total, OK, NOT OK, and Percentages
            var totalPts = (docBefore.checkpoints || []).length;
            var okPts = 0, notOkPts = 0, naPts = 0;
            var stColIdx = docBefore.mapping.colStatus;
            (docBefore.checkpoints || []).forEach(function(_, rIdx) {
                var stVal = String(finalAuditData[rIdx + '_' + stColIdx] || '').trim().toUpperCase();
                if (stVal === 'OK') okPts++;
                else if (stVal === 'NOT OK') notOkPts++;
                else if (stVal === 'N.A.') naPts++;
            });
            var okPct = totalPts > 0 ? Math.round((okPts / totalPts) * 100) : 0;
            var notOkPct = totalPts > 0 ? Math.round((notOkPts / totalPts) * 100) : 0;

            postToAppsScript({
                action: 'submit_audit',
                auditId: latestStored.auditEntryId || latestStored.id,
                storedDocId: latestStored.id,
                fileName: latestStored.name,
                templateName: docBefore.name,
                plant: docBefore.plant,
                freq: docBefore.freq,
                auditorName: state.currentUser ? state.currentUser.name : 'Auditor',
                totalCheckpoints: totalPts,
                okCount: okPts,
                notOkCount: notOkPts,
                naCount: naPts,
                okPercentage: okPct,
                notOkPercentage: notOkPct,
                auditData: finalAuditData,
                readableSummary: readableSummary,
                observations: relatedObs,
                toEmails: chosenTo,
                ccEmails: chosenCc,
                excelBase64: excelB64,
                pdfBase64: pdfB64
            });
        }
    };

    var _origSubmitActionUpdateGAS = submitActionUpdate;
    submitActionUpdate = function(obsId) {
        _origSubmitActionUpdateGAS(obsId);
        var o = DB.observations.find(function(x) { return x.id === obsId; });
        if (o) {
            var plantEmails = DB.emailLists[o.plant] || { to: [], cc: [] };
            postToAppsScript({
                action: 'update_observation',
                observationId: o.id,
                checkpoint: o.checkpoint,
                observation: o.observation,
                responsibilityName: o.responsibilityName,
                actionStatus: o.actionStatus,
                resolutionNotes: o.resolutionNotes,
                evidenceUrl: o.evidenceDataUrl || '',
                auditorVerified: !!o.auditorVerified,
                notifyEmails: plantEmails.to || []
            });
        }
    };

    var _origVerifyObservationGAS = verifyObservation;
    verifyObservation = function(obsId) {
        _origVerifyObservationGAS(obsId);
        setTimeout(function() {
            var o = DB.observations.find(function(x) { return x.id === obsId; });
            if (o && o.auditorVerified) {
                var respObj = DB.responsibilities.find(function(r) { return r.id === o.responsibilityId || r.name === o.responsibilityName; });
                var notify = respObj && respObj.email ? [respObj.email] : [];
                postToAppsScript({
                    action: 'update_observation',
                    observationId: o.id,
                    checkpoint: o.checkpoint,
                    observation: o.observation,
                    responsibilityName: o.responsibilityName,
                    actionStatus: 'closed',
                    resolutionNotes: o.resolutionNotes,
                    evidenceUrl: o.evidenceDataUrl || '',
                    auditorVerified: true,
                    notifyEmails: notify
                });
            }
        }, 1200);
    };

    document.addEventListener('click', function(e) { if (state.notifDropdownOpen && !e.target.closest('.notif-bell-wrap')) { state.notifDropdownOpen = false; render(); } });

    _baseRender();

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('./sw.js').catch(function(){});
    }
    </script>
</body>
</html>
